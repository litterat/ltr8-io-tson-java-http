# Location of the tson-java repo when it is consumed as a Gradle included build (the default; see
# settings.gradle.kts). Override with -Ptson.path=/some/other/checkout.
tson.path=../ltr8-io-tson-java

# The version to resolve when consuming published artifacts instead (-Ptson.published=true), which requires
# `./gradlew publishToMavenLocal` in that checkout first. Ignored by the included build, which substitutes
# whatever the sibling declares.
tson.version=0.35.0-SNAPSHOT
