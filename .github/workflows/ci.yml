name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: tson-java-http

      # This build consumes tson-java either as an included build or from mavenLocal; both need the
      # sibling repo on disk, since it publishes to mavenLocal only and there is no remote to fetch from.
      - uses: actions/checkout@v5
        with:
          repository: litterat/ltr8-io-tson-java
          path: ltr8-io-tson-java

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        working-directory: tson-java-http
        run: ./gradlew build -Ptson.path=../ltr8-io-tson-java

      # The included build above substitutes the sibling's projects and never touches a jar, so it proves
      # nothing about what tson-java actually publishes. This does: publish the real artifacts, then build
      # against them, so a broken POM, a missing transitive dependency or a bad module descriptor fails here
      # rather than in whatever project depends on them next.
      - name: Publish tson-java and build against the published artifacts
        run: |
          cd ltr8-io-tson-java && ./gradlew publishToMavenLocal
          cd ../tson-java-http && ./gradlew build -Ptson.published=true

      # Not reached by `build` -- javadoc is its own task tree, so a broken doc comment
      # is invisible to the line above.
      - name: Javadoc
        working-directory: tson-java-http
        run: ./gradlew javadoc -Ptson.path=../ltr8-io-tson-java
